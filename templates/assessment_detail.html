{% extends "base.html" %}
{% block content %}
<h1>Assessment #{{ assessment.id }}</h1>
<p>Status: {{ assessment.status }}</p>
<p>Created: {{ assessment.created_at }}</p>

<h2>Uploaded Images</h2>
{% for name in image_names %}
  <img src="{{ url_for('static', filename='uploads/' + name) }}" width="200">
{% endfor %}

<p><a href="{{ url_for('auth.dashboard') }}">Back to dashboard</a></p>
{% endblock %}
